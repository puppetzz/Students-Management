services:
  postgresql:
    image: postgres:17.6
    container_name: qlhv_postgres
    environment:
      POSTGRES_DB: qlhv_db
      POSTGRES_USER: qlhv_user
      POSTGRES_PASSWORD: NNhnr6OizkQM
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - qlhv_network

